# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Mills' constant and primes between consecutive cubes, assuming the Riemann Hypothesis"
  description: >-
    Assuming Mathlib's RiemannHypothesis as an explicit hypothesis: (1) for every n >= 1 there
    is a prime strictly between n^3 and (n+1)^3; (2) the least real A > 1 such that
    floor(A^(3^n)) is prime for every n >= 1 exists and lies strictly between 1.3063778838 and
    1.3063778839. Statement (2) is formal-conjectures' Mills.lower_bound_of_RH, copied verbatim.
  authors:
    - "Claude (Anthropic), in Claude Code sessions run by Ryan Kalfus"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ryan Kalfus"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A41", "11M26", "68V15"]

sources:
  - title: "Determining Mills' Constant and a Note on Honaker's Problem"
    authors:
      - "Chris K. Caldwell"
      - "Yuanyou Cheng"
    id: "J. Integer Seq. 8 (2005), Article 05.4.1"
    type: "article"
    location: "https://cs.uwaterloo.ca/journals/JIS/VOL8/Caldwell/caldwell78.pdf"
    relationship: "independently-proves"
    note: >-
      Lemma 5 (a prime between consecutive cubes under RH) is formalized for positive integers;
      the first ten decimals of Theorem 1 (the least Mills constant under RH) are formalized.
      The proofs follow the same idea but use a different explicit psi bound (7/8 instead of
      Schoenfeld's 1/(8 pi)) and, below n = 1,200,001, kernel-checked Pocklington certificates.
    author_endorsement: "not-contacted"
  - title: "A prime-representing function"
    authors:
      - "W. H. Mills"
    id: "Bull. Amer. Math. Soc. 53 (1947), 604"
    type: "article"
    relationship: "background"
  - title: "formal-conjectures: FormalConjectures/Wikipedia/Mills.lean"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/2207c54/FormalConjectures/Wikipedia/Mills.lean"
    type: "formalization"
    relationship: "other"
    note: "Source of the definitions IsMills, IsMinMills and the statement lower_bound_of_RH, copied verbatim."
    license: "Apache-2.0"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/google-deepmind/cryptids/tree/3647718b5df22e1a61462dec0376bd204526285a"
    relationship: "builds-on"
    note: >-
      Six modules proving |psi(x) - x| <= (7/8) sqrt(x) log(x)^2 for x >= 5000 under RH are
      vendored unmodified in vendor-cryptids/; GRHCorollaries/PsiBound.lean repeats upstream's
      25-line assembly of that bound.

status:
  scope: >-
    Formalized, with RH as a hypothesis: a prime strictly between n^3 and (n+1)^3 for every
    natural n >= 1; the least Mills number lies in (1.3063778838, 1.3063778839); a least Mills
    number exists; a Mills number exists. Formalized with no hypothesis: a prime strictly between
    n^3 and (n+1)^3 for 1 <= n <= 1,200,000. Not formalized: the unconditional Mills' theorem
    (formal-conjectures' Mills.exists' and Mills.exists_least), Mills.irrational, digits of
    Mills' constant beyond the tenth, Lemma 5 for non-integer x, and RH itself (it is not
    discharged here; the Lean proof of RH announced 2026-11-20 is on a different Mathlib).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5-2", "claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        A coordinating agent wrote the plan, the analytic proofs and the assembly, and delegated
        self-contained lemmas (Mills lower bound, Cantor-intersection construction, least element,
        certificate-checker soundness) to sub-agents through written briefs; every sub-agent file
        was rebuilt by the coordinator. A Python script generates the certificates; the Lean
        kernel checks them with decide +kernel.
      cost:
        wall_time: "about 8 hours on 2026-11-22"
        spend_usd: "subscription-based"
        hardware: "local machine (8 GB Apple M3 laptop); GitHub Actions for a sandboxed comparator run"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    Human role: choosing to pursue RH-conditional results and approving publication. The Lean
    code was written by AI agents. No human mathematician has reviewed the proofs.

fidelity:
  divergences: >-
    The Mills statement is formal-conjectures' text verbatim, elaborated against Mathlib v4.35.0
    rather than the v4.33.1 pinned by formal-conjectures. Caldwell-Cheng's Lemma 5 is stated for
    real x >= 2^(1/3) - 1; only the positive-integer case is formalized. Only ten of the 600 digits
    in Caldwell-Cheng's Theorem 1 are formalized.

review:
  status: "self-assessed"
  reviewers:
    - "none (two independent AI referee passes, reports not included)"
  notes: >-
    Two independent AI referee agents audited statement fidelity against the sources, vacuity,
    soundness hygiene, the certificate checker, coverage of the finite range (all 1,200,000
    certificates re-checked by separate code) and the documentation; no theorem-level problem
    was found and their wording corrections were applied. lake comparator accepted the five
    compared theorems inside its sandbox on GitHub Actions (Lean kernel and nanoda), and
    unsandboxed locally with --paranoid on the Mills part. See VERIFICATION.md.

alignment:
  namespace: "Mills, GRHCorollaries"
  statements:
    - source: "Caldwell-Cheng 2005, Theorem 1 (first ten decimals)"
      lean: "Mills.lower_bound_of_RH"
      module: "GRHCorollaries.Mills.Main"
      status: "proved"
      note: "Statement copied from formal-conjectures; RH is an explicit hypothesis."
    - source: "Non-vacuity of Theorem 1"
      lean: "Mills.exists_isMinMills_of_RH"
      module: "GRHCorollaries.Mills.Main"
      status: "proved"
      note: "Assuming RH, a least Mills number exists, so the hypothesis of lower_bound_of_RH is satisfiable."
    - source: "Mills 1947 (conditional, weaker form)"
      lean: "Mills.exists_isMills_of_RH"
      module: "GRHCorollaries.Mills.Main"
      status: "adapted"
      note: "Proved only assuming RH; Mills' theorem itself needs no hypothesis."
    - source: "Caldwell-Cheng 2005, Lemma 5, integers n >= 1"
      lean: "GRHCorollaries.exists_prime_between_consecutive_cubes_of_RH"
      module: "GRHCorollaries.Cubes.Main"
      status: "proved"
      note: "Positive-integer case only."
    - source: "Supporting lemma used for Mills' constant"
      lean: "GRHCorollaries.exists_prime_between_cubes_of_RH"
      module: "GRHCorollaries.PrimeBetweenCubes"
      status: "proved"
      note: "For N >= 6^12, a prime p with N^3 < p and p + 1 < (N+1)^3."

acknowledgements: >-
  Mathlib; google-deepmind/cryptids (explicit psi bound under RH); google-deepmind/formal-conjectures
  (statement); Lean FRO's comparator, nanoda, lean4lean, con-leche and con-ron.
